name: Maintenance

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 6 AM UTC
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Run full validation
        run: ./scripts/validate.sh

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        run: |
          FOUND=0
          for f in $(find red_ai/ -name "*.py"); do
            SECRETS=$(grep -nE '(password|secret|api_key|token)\s*=' "$f" | grep -vE '(environ|getenv|args\.|#|None|""|'"'"''"'"')' | head -5)
            if [ -n "$SECRETS" ]; then
              echo "::warning file=$f::Possible hardcoded secret"
              echo "$SECRETS"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Hardcoded secrets detected — review findings above"
            exit 1
          fi

  stale-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for large files
        run: |
          find . -type f -size +1M -not -path './.git/*' -not -path './.venv/*' | while read f; do
            echo "::warning file=$f::File exceeds 1MB"
          done

      - name: Check Python 3.6 compatibility
        run: |
          # Check for walrus operator (:=) which requires Python 3.8+
          if grep -rnE ':=' red_ai/*.py | grep -vE '^\s*#'; then
            echo "::error::Walrus operator (:=) found — requires Python 3.8+"
            exit 1
          fi
          # Check for positional-only params (/) which requires Python 3.8+
          # Check for f-string = debugging (f"{x=}") which requires Python 3.8+
          if grep -rnE 'f"[^"]*\{[^}]+=\}' red_ai/*.py; then
            echo "::error::f-string debugging syntax (f'{x=}') found — requires Python 3.8+"
            exit 1
          fi
